name: nishiki-website

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: nishiki-website:local
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel_token
    depends_on:
      website:
        condition: service_healthy
    volumes:
      - type: bind
        source: /etc/nishiki/cloudflared-token
        target: /run/secrets/tunnel_token
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge
